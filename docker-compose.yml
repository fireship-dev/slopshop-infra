services:
  app:
    build:
      context: ../slopshop
      dockerfile: ../slopshop-infra/Dockerfile
    image: slopshop:local
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: "3000"
      DATABASE_URL: postgresql://slopshop:slopshop@db:5432/slopshop
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: slopshop
      POSTGRES_PASSWORD: slopshop
      POSTGRES_DB: slopshop
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U slopshop"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
